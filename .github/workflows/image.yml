# Builds the relay image for linux/amd64 and linux/arm64 on every push and pull request. Pushes it to
# ghcr.io/edde746/owp-relay only for tags relay-v<version>: relay-v1.2.3 publishes 1.2.3, 1.2 and 1; a pre-release
# tag (relay-v1.3.0-rc.1) publishes only its own version.
name: image

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/relay-v') }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/edde746/owp-relay
          flavor: latest=false
          tags: |
            type=match,pattern=^relay-v(\d+\.\d+\.\d+.*)$,group=1
            type=match,pattern=^relay-v(\d+\.\d+)\.\d+$,group=1
            type=match,pattern=^relay-v(\d+)\.\d+\.\d+$,group=1
            type=sha,enable=${{ env.PUBLISH != 'true' }}
          labels: |
            org.opencontainers.image.title=owp-relay
            org.opencontainers.image.licenses=Apache-2.0

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: relay
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ env.PUBLISH == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
